# domicile-relay on fly.io, for mcp.domicile-desktop.com. Deployed by
# .github/workflows/relay.yml each time main changes the relay; by hand, from
# the repository's root:
#
#   fly deploy . --config packages/domicile-relay/fly.toml --dockerfile packages/domicile-relay/Dockerfile
#
# Both ports are plain TCP, with no handlers, so fly.io passes the bytes
# through untouched: TLS ends on the desk. Plain TCP needs a dedicated IPv4
# (`fly ips allocate-v4`). Desks and the agents reaching them must meet on
# the same relay, so it runs as one machine that never stops.

app = "domicile-relay"
primary_region = "sjc"

# Agents, at <label>.mcp.domicile-desktop.com.
[[services]]
  internal_port = 443
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443

  [services.concurrency]
    type = "connections"
    soft_limit = 5000
    hard_limit = 10000

# Desks dialing in, at mcp.domicile-desktop.com.
[[services]]
  internal_port = 7444
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 7444

  [services.concurrency]
    type = "connections"
    soft_limit = 5000
    hard_limit = 10000
