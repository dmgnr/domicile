<!doctype html>
<title>served</title>
<!-- Served by the guard's own server, at http://127.0.0.1/ and then at
     http://localhost/: two origins, so each asks for its location anew.
     Says how the request ended: "error 1" is PERMISSION_DENIED; anything
     else (a position, or no position to give) came after a grant. The
     title says everything at once, as the desk may report only its last. -->
<script>
  navigator.geolocation.getCurrentPosition(
    () => {
      document.title = "done|position";
    },
    (error) => {
      document.title = `done|error ${error.code}`;
    },
    { timeout: 5000 },
  );
</script>
