name: Nix build

# Build everything the flake produces.
#
# No `paths:` filter. engine.yml ignores changes to
# `packages/domicile-engine/engine-release.nix`, because a repin cannot change
# what it builds. This job covers a repin instead: `nix build .#manganese
# .#simple` fetches the url and hash in that file, so a deleted tag or bad hash
# fails here in minutes. `packages/ci/tests/test-engine-path-filter.sh` fails if this job
# gains a `paths:` filter.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: nix-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nix is installed below, so a skip means a `test:nix` check broke.
  # No skips are expected.
  DOMICILE_CHECK_STRICT: "1"

jobs:
  packages:
    runs-on: ubuntu-latest
    # Includes the tty VM tests (`tty-on-a-card-with-no-3d` and
    # `two-monitors-on-a-tty` in flake.nix).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The runner's /dev/kvm is root's. Opened before nix is installed, so
      # nix sees the `kvm` feature the VM test asks for.
      - name: Let the VM test use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # `accept-flake-config` substitutes from Domicile's cache in flake.nix
      # what `stable` already built.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
            accept-flake-config = true

      # The assertions are `distro`' `test:nix`, so they can also be run
      # from a checkout. Bun is here only to run turbo; a nix build has its own
      # node_modules.
      - uses: oven-sh/setup-bun@v2
      # Built first, with its log streamed, so a stalled build shows where it
      # stalled. Inside `test:nix` the check-runner keeps a check's log until
      # it ends, and a job timeout ends it first.
      - name: Build the desktops
        run: nix build -L --no-link .#manganese .#simple
      - run: bun run turbo run test:nix
