name: Publish packages

# Publishes Domicile's packages.
#
# - A push to main publishes every public `@domicile-desktop/*` package to npm
#   as `0.0.0-alpha-<sha>` under `next` (.github/scripts/publish-packages.sh).
# - Dispatched with `release`, promotes `stable` to `release`. It builds and
#   installs the distribution packages at the versions changesets gave them,
#   publishes npm under `latest`, the signed repositories on R2 and the AUR's
#   `domicile-bin`, then tags each new version, moves `release` and syncs
#   `site` (site.yml). Every step skips what is already published, so a
#   failed release is rerun as it is. `dry_run`, on by default, builds and
#   checks everything and publishes nothing.
# - With `prerelease` too, publishes `stable` as a prerelease of `domicile`'s
#   version to the repositories and the AUR, for testing the installs: no npm,
#   no tags, `release` stays. The release replaces it.
#
# The release is here, not in its own workflow, because npm's trusted
# publishing names one workflow file, and checks the top-level one.
#
# Uses trusted publishing: npm accepts this workflow's OIDC token for packages
# whose trusted publisher on npmjs.com names this repository and file, and adds
# provenance. A package without a trusted publisher refuses the publish. npm
# attaches one only to an existing package, so a new package is first claimed
# by hand with a placeholder version and given its trusted publisher there.
#
# A release reads the secrets `DOMICILE_SIGNING_KEY`, `R2_ACCESS_KEY_ID`,
# `R2_SECRET_ACCESS_KEY` and `AUR_SSH_KEY`. The variables `R2_ACCOUNT_ID`,
# `DOMICILE_R2_BUCKET` and `DOMICILE_REPO_URL` override the scripts' defaults.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Promote stable to release and publish it
        type: boolean
        default: false
      dry_run:
        description: With release, build and check everything but publish nothing
        type: boolean
        default: true
      prerelease:
        description: With release, publish stable as a prerelease to the repositories and the AUR only
        type: boolean
        default: false

# One at a time and none thrown away: each run publishes its own commit.
concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # npm 11.5.1 is the first that publishes with an OIDC token.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: .github/scripts/publish-packages.sh

  release-check:
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.check.outputs.commit || steps.precheck.outputs.commit }}
    steps:
      # The whole history, so release can be checked as an ancestor.
      - uses: actions/checkout@v7
        with:
          ref: stable
          fetch-depth: 0
      - id: check
        if: ${{ !inputs.prerelease }}
        run: .github/scripts/release-check.sh
      # A prerelease sorts before its version, so it comes before that version
      # is released.
      - id: precheck
        if: inputs.prerelease
        run: |
          version="$(jq -r .version packages/domicile/package.json)"
          if git rev-parse -q --verify "refs/tags/domicile@$version" >/dev/null; then
            echo "domicile $version is released: a prerelease of it would sort before it" >&2
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  # A release reuses the packages of a dry run of the same commit that passed,
  # so it skips the builds and installs that run already did.
  reuse:
    needs: release-check
    if: ${{ needs.release-check.outputs.commit != '' && !inputs.dry_run && !inputs.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: echo "run=$(.github/scripts/release-dry-run.sh find "$COMMIT")" >>"$GITHUB_OUTPUT"
        env:
          COMMIT: ${{ needs.release-check.outputs.commit }}
          GH_TOKEN: ${{ github.token }}

  release-packages:
    needs: [release-check, reuse]
    # `reuse` is skipped for a dry run or a prerelease, which then build.
    if: ${{ !cancelled() && needs.release-check.outputs.commit != '' && needs.reuse.result != 'failure' && needs.reuse.outputs.run == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/distro-packages.yml
    with:
      ref: ${{ needs.release-check.outputs.commit }}
      release: ${{ !inputs.prerelease }}
      prerelease: ${{ inputs.prerelease }}

  release:
    needs: [release-check, reuse, release-packages]
    if: ${{ !cancelled() && needs.release-check.outputs.commit != '' && (needs.release-packages.result == 'success' || needs.reuse.outputs.run != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      DOMICILE_RELEASE: ${{ !inputs.prerelease && '1' || '' }}
      DOMICILE_PRERELEASE: ${{ inputs.prerelease && '1' || '' }}
      DOMICILE_RELEASE_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      # The tags, so `release-tag.sh` tags only versions not tagged yet.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-check.outputs.commit }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: distro-out/
          run-id: ${{ needs.reuse.outputs.run || github.run_id }}
          github-token: ${{ github.token }}
      - if: needs.reuse.outputs.run != ''
        run: echo "::notice::packages from dry run $RUN"
        env:
          RUN: ${{ needs.reuse.outputs.run }}

      - name: npm
        if: ${{ !inputs.prerelease }}
        run: .github/scripts/publish-packages.sh
        env:
          DOMICILE_PUBLISH_DRY_RUN: ${{ inputs.dry_run && runner.temp || '' }}
      - name: The apt, rpm and pacman repositories
        run: |
          mapfile -t tools < <(sed -n 's/^\([a-z]\)/nixpkgs#\1/p' packages/distro/repo-tools)
          nix shell --inputs-from . "${tools[@]}" --command \
            .github/scripts/release-repos.sh distro-out distro-repo
        env:
          DOMICILE_SIGNING_KEY: ${{ secrets.DOMICILE_SIGNING_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          DOMICILE_R2_BUCKET: ${{ vars.DOMICILE_R2_BUCKET }}
      # The Arch package as the repository holds it, whose checksum the
      # PKGBUILD names.
      - name: The AUR
        run: |
          version="$(packages/distro/version.sh . arch)"
          nix shell --inputs-from . nixpkgs#libarchive --command .github/scripts/release-aur.sh \
            "distro-repo/arch/x86_64/domicile-$version-1-x86_64.pkg.tar.zst"
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          DOMICILE_REPO_URL: ${{ vars.DOMICILE_REPO_URL }}
      - name: Tag the versions and move release
        if: ${{ !inputs.prerelease }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/release-tag.sh
      # Last, so only a dry run that passed every step leaves it.
      - id: marker
        if: ${{ inputs.dry_run && !inputs.prerelease }}
        run: |
          mkdir dry-run
          echo "$COMMIT" >dry-run/commit
          echo "name=$(.github/scripts/release-dry-run.sh marker "$COMMIT")" >>"$GITHUB_OUTPUT"
        env:
          COMMIT: ${{ needs.release-check.outputs.commit }}
      - if: steps.marker.outputs.name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.marker.outputs.name }}
          path: dry-run/

  # `site` follows the release, keeping the site fixes it doesn't have.
  site:
    needs: release
    if: ${{ !inputs.dry_run && !inputs.prerelease && needs.release.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/site.yml
